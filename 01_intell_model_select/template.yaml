AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'GenAI Model Selection Demo - SAM Template for Easy Instructor Deployment'

Parameters:
  JevSecretName:
    Type: String
    Default: ""
    Description: SSM parameter name or Secrets Manager secret name holding the TypeSafe key. Empty means Jev is not configured. Provide a name only, never a key value.
  JevSecretType:
    Type: String
    Default: ssm
    AllowedValues: [ssm, secretsmanager]
    Description: Backend that stores the Jev secret.

Conditions:
  HasJevSecret: !Not [!Equals [!Ref JevSecretName, ""]]
  JevUsesSsm: !And [!Condition HasJevSecret, !Equals [!Ref JevSecretType, ssm]]
  JevUsesSecretsManager: !And [!Condition HasJevSecret, !Equals [!Ref JevSecretType, secretsmanager]]

Globals:
  Function:
    Timeout: 900
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        LOG_LEVEL: INFO
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'*'"
      AllowOrigin: "'*'"

Resources:
  # Lambda Function for GenAI Routing
  GenAIRouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: genai-model-selection-demo-router
      CodeUri: lambda/
      Handler: lambda_handler.lambda_handler
      Description: Main Lambda function for intelligent GenAI model routing
      Environment:
        Variables:
          # Jev router configuration. None of these hold a secret value;
          # JEV_SECRET_NAME is only the name of an SSM parameter or
          # Secrets Manager secret, never the key itself.
          JEV_SECRET_NAME: !Ref JevSecretName
          JEV_SECRET_TYPE: !Ref JevSecretType
          JEV_CONFIDENCE_THRESHOLD: "0.3"
          JEV_TIMEOUT_SECONDS: "5"
          JEV_MODEL: "jev-1.13.0"
          JEV_HIGH_CONSEQUENCE_SIGNAL: "false"
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:Converse
              - bedrock:ConverseStream
              - bedrock:GetFoundationModel
              - bedrock:ListFoundationModels
            Resource: "*"
          # Conditional read access to the Jev secret, scoped to the single
          # named resource. When JevSecretName is empty, both statements
          # resolve to AWS::NoValue and no extra permission is granted.
          - !If
            - JevUsesSsm
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${JevSecretName}"
            - !Ref AWS::NoValue
          - !If
            - JevUsesSecretsManager
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${JevSecretName}-??????"
            - !Ref AWS::NoValue
      Events:
        QueryApi:
          Type: Api
          Properties:
            Path: /query
            Method: post
        HealthApi:
          Type: Api
          Properties:
            Path: /health
            Method: get
        MetricsApi:
          Type: Api
          Properties:
            Path: /metrics
            Method: get
        AdminSimulateFailure:
          Type: Api
          Properties:
            Path: /admin/simulate-failure
            Method: post
      Tags:
        Project: genai-model-selection-demo
        Environment: demo
        Purpose: education

  # S3 Bucket for Website
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "genai-demo-website-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      Tags:
        - Key: Project
          Value: genai-model-selection-demo
        - Key: Environment
          Value: demo

  # S3 Bucket Policy for CloudFront
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # Origin Access Control for CloudFront
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref CloudFrontOriginAccessControl
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
      Tags:
        - Key: Project
          Value: genai-model-selection-demo
        - Key: Environment
          Value: demo

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  
  WebsiteURL:
    Description: CloudFront website URL
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
  
  WebsiteBucket:
    Description: S3 bucket for website files
    Value: !Ref WebsiteBucket
  
  LambdaFunction:
    Description: Lambda function name
    Value: !Ref GenAIRouterFunction
